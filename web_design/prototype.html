<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Obsidian workspace · design prototype</title>
  <style>
    @import '../web/src/styles/tokens.css';
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px; background: var(--bg-app); color: var(--text-primary); font: 14px/1.6 var(--font-ui); }
    header { display: flex; align-items: baseline; gap: 24px; margin-bottom: 24px; }
    h1 { font-size: 24px; font-weight: 500; letter-spacing: -.03em; margin: 0; }
    p { color: var(--text-muted); margin: 8px 0; }
    a { color: var(--text-secondary); }
    nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 24px 0; }
    button { font: inherit; color: var(--text-secondary); background: transparent; border: 1px solid var(--border-base); border-radius: var(--radius-md); padding: 8px 16px; cursor: pointer; }
    button:hover { background: var(--overlay-hover); }
    button[aria-pressed=true] { color: var(--text-primary); background: var(--overlay-selected); }
    button:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 2px; }
    figure { margin: 0; }
    img { display: block; max-width: 1440px; width: 100%; border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); }
    figcaption { color: var(--text-muted); padding: 16px 0; }
    footer { border-top: 1px solid var(--border-subtle); margin-top: 16px; padding-top: 16px; color: var(--text-muted); }
    @media(max-width:600px) { body { padding: 16px; } header { display: block; } }
  </style>
</head>
<body>
  <header><h1>Obsidian workspace</h1><a href="https://www.figma.com/design/ajGYWkwUAAGLcOMbXccnxp">Open the linked Figma prototype</a></header>
  <p>Design exploration and verified implementation. Calm surfaces, clear hierarchy, continuous work.</p>
  <nav aria-label="Prototype screens">
    <button aria-pressed="true" data-image="design-chat.png" data-caption="Design first: Chat, created in Figma before implementation.">Chat design</button>
    <button aria-pressed="false" data-image="design-files.png" data-caption="Design first: file manager and folder move convention.">Files design</button>
    <button aria-pressed="false" data-image="design-tools.png" data-caption="Design first: extension submenu and schema disclosure.">Tools design</button>
    <button aria-pressed="false" data-image="qa-conversation-1440.png" data-caption="Verified interface: Chat with right-aligned navy user messages.">Chat interface</button>
    <button aria-pressed="false" data-image="qa-editor-1440.png" data-caption="Verified interface: editor uses the full available width.">Editor</button>
    <button aria-pressed="false" data-image="design-split.png" data-caption="Two-pane design: menus navigate in the focused tab; new tabs open at its current location.">Split design</button>
    <button aria-pressed="false" data-image="qa-split-1440.png" data-caption="Verified split view: independent pane navigation, retained drafts and resizable divider.">Split interface</button>
    <button aria-pressed="false" data-image="qa-composer-menu.png" data-caption="Chat extras are visibly Coming soon, without backend actions.">Coming soon menu</button>
    <button aria-pressed="false" data-image="qa-files-error.png" data-caption="Recoverable error state: readable API message and Retry.">Error state</button>
  </nav>
  <figure><img id="screen" src="design-chat.png" alt="Obsidian chat design"><figcaption id="caption">Design first: Chat, created in Figma before implementation.</figcaption></figure>
  <footer>Source of truth: tokens.json and the design charter in README.md. All screenshots use QA fixtures; no personal conversation data is stored here.</footer>
  <script>
    document.querySelectorAll('nav button').forEach(button => button.addEventListener('click', () => {
      document.querySelectorAll('nav button').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
      document.querySelector('#screen').src = button.dataset.image;
      document.querySelector('#screen').alt = button.dataset.caption;
      document.querySelector('#caption').textContent = button.dataset.caption;
    }));
  </script>
</body>
</html>
