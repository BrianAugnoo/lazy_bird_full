<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DB Schema</title>
    <style>
        body {
            margin: 0;
            padding: 2rem;
            background: #f4f6f8;
            color: #17202a;
            font-family: system-ui, sans-serif;
            overflow: hidden;
        }
        main {
            width: min(1800px, calc(100vw - 4rem));
            height: calc(100vh - 4rem);
            margin: auto;
            padding: 1.5rem;
            box-sizing: border-box;
            background: #fff;
            border: 1px solid #d8dee6;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
        }
        h1 { margin: 0 0 1.5rem; font-size: 1.4rem; flex-shrink: 0; }
        .diagram-scroll {
            flex: 1;
            min-height: 0;
            overflow: auto;
            border: 1px solid #e1e6eb;
            background: #fafafa;
        }
        .mermaid {
            width: max-content;
            min-width: 100%;
            min-height: 700px;
            padding: 2rem;
            box-sizing: border-box;
        }
    </style>
    <script type="module">
        import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
        mermaid.initialize({ startOnLoad: true, theme: "neutral", securityLevel: "loose" });
    </script>
</head>
<body>
    <main>
        <h1>Schéma de la base de données</h1>
        <div class="diagram-scroll">
            <div class="mermaid">{{ diagram | safe }}</div>
        </div>
    </main>
</body>
</html>
